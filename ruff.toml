# Lint for real errors (pyflakes + syntax), not style. Run: ruff check .
target-version = "py310"
extend-exclude = ["*.ipynb"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Training/benchmark scripts and tests keep some intermediate results for readability.
"ml/*" = ["F841"]
"tests/*" = ["F841"]
# Optional GUI dependencies are imported only to probe availability.
"firmware/ground_cam_viewer.py" = ["F401"]
